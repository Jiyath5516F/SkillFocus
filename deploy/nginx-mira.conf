# Add INSIDE the existing server { listen 443 ssl ... } block that answers requests to the server IP.
# Mira is served under /Mira/ and proxied to the local Node service. Nothing else is changed.
location = /Mira { return 301 /Mira/; }
location /Mira/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 200k;
}
